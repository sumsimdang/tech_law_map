name: 주간 법령 점검

on:
  schedule:
    - cron: "23 21 * * 0"  # 매주 월요일 06:23 (한국 시간)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["README.md"]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "numpy>=2,<3"
      - id: pages
        uses: actions/configure-pages@v5

      - name: 최신 법령으로 다시 만들기
        id: run
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          set +e
          python3 run_update.py . "$RUNNER_TEMP/work" "$today"
          code=$?
          set -e
          case "$code" in
            0) status=built ;;
            2) status=needs_review ;;
            *) status=error ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "today=$today" >> "$GITHUB_OUTPUT"

      - name: 게시할 페이지 준비
        if: steps.run.outputs.status == 'built'
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          out="$RUNNER_TEMP/work/out"
          mkdir -p site
          python3 page.py "$out/tech-law-map.html" site/index.html "$BASE_URL/"
          cp og.png site/
          cp "$out/cross_citations.csv" site/
          touch site/.nojekyll
          cp "$out/state.json" "$out/changelog.json" .

      - name: 점검 기록 저장
        if: steps.run.outputs.status == 'built'
        env:
          TODAY: ${{ steps.run.outputs.today }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json changelog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "주간 점검 $TODAY"
          git pull --rebase --quiet
          git push

      - uses: actions/upload-pages-artifact@v3
        if: steps.run.outputs.status == 'built'
        with:
          path: site

      - name: 지난 알림 닫기
        if: steps.run.outputs.status == 'built'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label needs-review --state open --json number -q '.[].number' 2>/dev/null || true); do
            gh issue close "$n" --comment "다시 정상 게시했어요."
          done

      - name: 확인 필요 알림
        if: steps.run.outputs.status != 'built'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.run.outputs.status }}
          TODAY: ${{ steps.run.outputs.today }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 notify.py "$RUNNER_TEMP/work/out/report.json" "$STATUS" "$TODAY" "$RUN_URL" issue.md
          gh label create needs-review --color d93f0b --description "주간 점검이 멈춤" --force
          num=$(gh issue list --label needs-review --state open --json number -q '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file issue.md
          else
            gh issue create --title "주간 점검이 멈췄어요: 확인 필요" --label needs-review --body-file issue.md
          fi
          exit 1

  deploy:
    needs: build
    if: needs.build.outputs.status == 'built'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
